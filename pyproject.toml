[project]
name = "ghaith-mjlab-tasks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mjlab"]

[project.entry-points."mjlab.tasks"]
cartpole = "ghaith_cartpole"
r1_wire_velocity = "ghaith_r1_wire"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghaith_cartpole", "src/ghaith_r1_wire"]